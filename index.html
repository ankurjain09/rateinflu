<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrustReview (RateInflu) — Verified Influencer Reviews</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--primary:#4f46e5;--accent:#06b6d4;--success:#10b981;--warning:#f59e0b;
      --danger:#ef4444;--gray:#64748b;--light-gray:#f1f5f9;--dark:#1e293b}
    body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;
      background:linear-gradient(135deg,#f0f9ff 0%,#e0e7ff 100%);color:var(--dark)}
    nav{position:fixed;top:0;width:100%;background:white;box-shadow:0 1px 3px rgba(0,0,0,.1);
      padding:1rem 2rem;z-index:10}
    .nav-container{max-width:1300px;margin:auto;display:flex;justify-content:space-between;align-items:center}
    .logo{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.4rem;color:var(--primary);cursor:pointer}
    .logo-icon{width:28px;height:28px;background:linear-gradient(135deg,var(--primary),var(--accent));
      border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center}
    .btn-primary{background:linear-gradient(135deg,var(--primary),#3730a3);color:white;
      padding:.6rem 1.2rem;border:none;border-radius:10px;font-weight:600;cursor:pointer}
    .container{max-width:1300px;margin:auto;padding:6rem 2rem 2rem}
    .hero{text-align:center;margin-bottom:2rem}
    .hero h1{font-size:2.8rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .search-section{background:white;border-radius:20px;padding:1.5rem;box-shadow:0 6px 20px rgba(0,0,0,.08);margin-bottom:2rem}
    .search-bar{display:flex;gap:1rem;margin-bottom:1rem}
    .search-input{flex:1;padding:.9rem 1.2rem;border:2px solid var(--light-gray);border-radius:10px}
    .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}
    .card{background:white;border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.08);
      transition:.3s;cursor:pointer}
    .card:hover{transform:translateY(-5px);box-shadow:0 10px 24px rgba(0,0,0,.1)}
    .card-header{padding:1rem 1.2rem;background:linear-gradient(135deg,#f0f9ff,#e0e7ff)}
    .profile-img{width:64px;height:64px;border-radius:12px;
      background:linear-gradient(135deg,var(--primary),var(--accent));
      color:white;font-weight:700;font-size:1.4rem;display:flex;align-items:center;justify-content:center}
    .trust-badge{position:absolute;right:1rem;top:1rem;padding:.3rem .7rem;border-radius:8px;
      color:white;font-weight:700;font-size:.75rem}
    .trust-high{background:var(--success)}.trust-medium{background:var(--warning)}.trust-low{background:var(--danger)}
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <div class="logo" onclick="navigateHome()"><div class="logo-icon">✓</div>TrustReview</div>
      <div id="authContainer"></div>
    </div>
  </nav>

  <div id="home-page" class="page active">
    <div class="container">
      <div class="hero">
        <h1>Find Trusted Influencer Services</h1>
        <p>Verified community reviews for courses, bootcamps & coaching</p>
      </div>

      <div class="search-section">
        <div class="search-bar">
          <input id="searchInput" class="search-input" placeholder="Search influencers..." />
          <button class="btn-primary" onclick="searchInfluencers()">Search</button>
        </div>
      </div>

      <div id="influencersGrid" class="cards-grid"></div>
    </div>
  </div>
  <div id="profile-page" class="page">
    <div class="container" id="profileContainer"></div>
  </div>

  <script>
    /* ---------- Firebase init ---------- */
    const firebaseConfig = {
      apiKey:"AIzaSyAjYOUXAU1FusccFJQcsEWmo8W9CgSSmfA",
      authDomain:"rateinflu.firebaseapp.com",
      projectId:"rateinflu",
      storageBucket:"rateinflu.firebasestorage.app",
      messagingSenderId:"619786232167",
      appId:"1:619786232167:web:eca2e76803201421eccfc2"
    };
    firebase.initializeApp(firebaseConfig);
    const auth=firebase.auth(); const db=firebase.firestore();
    const provider=new firebase.auth.GoogleAuthProvider();

    let currentUser=null;
    auth.onAuthStateChanged(u=>{
      currentUser=u;
      const div=document.getElementById('authContainer');
      if(u){
        div.innerHTML=`<span style="margin-right:1rem;color:#555">${u.displayName}</span>
        <button class="btn-primary" onclick="logout()">Logout</button>`;
      }else{
        div.innerHTML=`<button class="btn-primary" onclick="login()">Login with Google</button>`;
      }
    });
    async function login(){await auth.signInWithPopup(provider);}
    function logout(){auth.signOut();}

    /* ---------- Page navigation ---------- */
    function navigateHome(){
      document.getElementById('home-page').classList.add('active');
      document.getElementById('profile-page').classList.remove('active');
    }
    function navigateProfile(){ 
      document.getElementById('home-page').classList.remove('active');
      document.getElementById('profile-page').classList.add('active');
      window.scrollTo(0,0);
    }

    /* ---------- Load influencers ---------- */
    let allInfluencers=[];
    async function loadInfluencers(){
      const grid=document.getElementById('influencersGrid');
      grid.innerHTML='<div class="loading-container"><div class="loading-spinner"></div><p>Loading...</p></div>';
      const snap=await db.collection("influencers").get();
      allInfluencers=snap.docs.map(d=>({id:d.id,...d.data()}));
      renderInfluencers(allInfluencers);
    }

    function renderInfluencers(list){
      const grid=document.getElementById('influencersGrid');
      grid.innerHTML=list.map(i=>{
        const initials=i.name.split(' ').map(n=>n[0]).join('');
        const trust=i.trustScore>80?'trust-high':i.trustScore>50?'trust-medium':'trust-low';
        const trustTxt=i.trustScore>80?'✓ Trusted':i.trustScore>50?'⚡ Mixed':'⚠️ Caution';
        return `<div class="card" onclick="openProfile('${i.id}')">
          <div class="trust-badge ${trust}">${trustTxt}</div>
          <div class="card-header">
            <div style="display:flex;gap:1rem;align-items:center">
              <div class="profile-img">${initials}</div>
              <div>
                <div style="font-weight:700;font-size:1.1rem">${i.name}</div>
                <div style="color:var(--gray);font-size:.9rem">${i.niche||''}</div>
              </div>
            </div>
          </div>
          <div style="padding:1rem;font-size:.9rem;color:var(--dark)">${i.bio||''}</div>
          <div style="padding:0 1rem 1rem;color:var(--gray);font-size:.85rem">${(i.stats?.reviewCount||0)} reviews • ${i.stats?.rating||0}★</div>
        </div>`;
      }).join('');
    }

    function searchInfluencers(){
      const term=document.getElementById('searchInput').value.toLowerCase();
      const filtered=allInfluencers.filter(i=>
        i.name.toLowerCase().includes(term) ||
        (i.niche||'').toLowerCase().includes(term)
      );
      renderInfluencers(filtered);
    }
    /* ---------- Profile ---------- */
    async function openProfile(id){
      navigateProfile();
      const cont=document.getElementById('profileContainer');
      cont.innerHTML='<div class="loading-container"><div class="loading-spinner"></div><p>Loading profile...</p></div>';
      const doc=await db.collection('influencers').doc(id).get();
      const inf={id:doc.id,...doc.data()};

      const svcSnap=await db.collection('influencers').doc(id).collection('services').get();
      const services=svcSnap.docs.map(d=>d.data());

      const revSnap=await db.collection('influencers').doc(id).collection('reviews').orderBy('createdAt','desc').get();
      const reviews=revSnap.docs.map(d=>d.data());

      cont.innerHTML=`
        <button class="back-btn" onclick="navigateHome()">← Back</button>
        <div class="profile-header">
          <div class="profile-img" style="width:80px;height:80px;font-size:1.8rem">${inf.name.split(' ').map(n=>n[0]).join('')}</div>
          <div>
            <div class="profile-h1">${inf.name}<span class="pill">${inf.niche||''}</span></div>
            <div class="muted">${inf.location||''}</div>
            <div class="muted">${inf.bio||''}</div>
          </div>
        </div>

        <div class="section">
          <h3>Services</h3>
          ${services.map(s=>`
            <div class="service-item">
              <div>${s.title||''}</div>
              <div class="service-price">$${s.price||''}</div>
            </div>`).join('')||'<p class="muted">No services listed.</p>'}
        </div>

        <div class="section">
          <h3>Reviews</h3>
          ${reviews.map(r=>`
            <div class="review-item">
              <strong>${r.userName||r.author||'Anonymous'}</strong>
              <p>${r.text}</p>
              <div class="muted">${new Date(r.createdAt?.seconds? r.createdAt.seconds*1000 : Date.now()).toLocaleDateString()}</div>
            </div>`).join('')||'<p class="muted">No reviews yet.</p>'}

          ${currentUser?`
            <div class="review-form">
              <input id="newReview" placeholder="Write a review..." />
              <button onclick="addReview('${id}')">Post</button>
            </div>`:
            '<p class="muted" style="margin-top:.5rem">Login to post a review.</p>'}
        </div>
      `;
    }

    async function addReview(id){
      const input=document.getElementById('newReview');
      const text=input.value.trim();
      if(!text)return;
      await db.collection('influencers').doc(id).collection('reviews').add({
        text,
        author:currentUser.displayName,
        uid:currentUser.uid,
        createdAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      openProfile(id); // refresh view
    }

    // Auto-load
    loadInfluencers();
  </script>
</body>
</html>
