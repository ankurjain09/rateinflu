<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrustReview – Verified Influencer Reviews</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

<style>
/* === Base TrustReview look === */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#4f46e5;--primary-dark:#3730a3;--accent:#06b6d4;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;
  --gray:#64748b;--light-gray:#f1f5f9;--dark:#1e293b;--white:#fff
}
body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#f0f9ff 0%,#e0e7ff 100%);
min-height:100vh;color:var(--dark)}
nav{background:var(--white);padding:1rem 2rem;position:fixed;width:100%;top:0;z-index:100;
box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nav-container{max-width:1300px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.4rem;color:var(--primary);cursor:pointer}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--primary),var(--accent));
border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;
padding:.6rem 1.2rem;border:none;border-radius:10px;font-weight:600;cursor:pointer}
.container{max-width:1300px;margin:auto;padding:6rem 2rem 2rem}
.hero{text-align:center;margin-bottom:2rem}
.hero h1{font-size:3rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--accent));
-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.search-section{background:#fff;border-radius:20px;padding:2rem;box-shadow:0 10px 40px rgba(0,0,0,.08);margin-bottom:2rem}
.search-bar{display:flex;gap:1rem;margin-bottom:1.5rem}
.search-input{flex:1;padding:1rem 1.2rem;border:2px solid var(--light-gray);border-radius:12px;font-size:1rem}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2rem}
.influencer-card{background:#fff;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);
overflow:hidden;cursor:pointer;transition:.3s}
.influencer-card:hover{transform:translateY(-6px)}
.card-header{padding:1.5rem;background:linear-gradient(135deg,#f0f9ff,#fce7f3)}
.profile-image{width:70px;height:70px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--accent));
color:#fff;font-weight:700;font-size:1.5rem;display:flex;align-items:center;justify-content:center}
.trust-badge{position:absolute;right:1rem;top:1rem;padding:.3rem .7rem;border-radius:8px;font-size:.75rem;font-weight:700;color:#fff}
.trust-high{background:var(--success)}.trust-medium{background:var(--warning)}.trust-low{background:var(--danger)}

/* === Modal Popup === */
#profileModal{display:none;position:fixed;z-index:9999;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,0.6);align-items:center;justify-content:center}
.modal-content{background:#fff;border-radius:20px;max-width:950px;width:90%;max-height:90vh;
overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);padding:0;position:relative;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.close-modal{position:absolute;top:15px;right:15px;font-size:1.8rem;background:none;border:none;cursor:pointer;color:var(--gray)}
.modal-header{padding:2rem;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;
display:flex;align-items:center;gap:1.5rem;border-top-left-radius:20px;border-top-right-radius:20px}
.modal-header .profile-image{width:90px;height:90px;font-size:2rem;background:rgba(255,255,255,0.2)}
.modal-header h2{font-size:1.8rem;font-weight:800;margin:0}
.modal-header p{font-size:1rem;color:#e5e7eb;margin-top:.25rem}

/* Tabs */
.tabs{display:flex;justify-content:flex-start;gap:2rem;padding:1rem 2rem;border-bottom:2px solid var(--light-gray);
background:#fff;position:sticky;top:0;z-index:5}
.tab-btn{background:none;border:none;font-weight:700;font-size:1rem;padding-bottom:.5rem;cursor:pointer;color:var(--gray);
transition:all .2s}
.tab-btn.active{color:var(--primary);border-bottom:3px solid var(--primary)}
.tab-content{padding:1.5rem 2rem;background:#fff;border-bottom-left-radius:20px;border-bottom-right-radius:20px}

/* Tab sections */
.section h3{font-size:1.1rem;font-weight:700;margin-bottom:.5rem}
.service-item,.review-item{border-bottom:1px solid var(--light-gray);padding:.75rem 0}
.review-item p{margin:.2rem 0}
.review-form{display:flex;gap:.5rem;margin-top:1rem}
.review-form input{flex:1;padding:.8rem 1rem;border:2px solid var(--light-gray);border-radius:10px}
.review-form button{padding:.8rem 1rem;background:var(--primary);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<nav>
  <div class="nav-container">
    <div class="logo" onclick="navigateHome()"><div class="logo-icon">✓</div>TrustReview</div>
    <div id="authContainer"></div>
  </div>
</nav>

<div id="home-page" class="page active">
  <div class="container">
    <div class="hero">
      <h1>Find Trusted Influencer Services</h1>
      <p>Community-verified reviews for courses, bootcamps, and coaching programs</p>
    </div>
    <div class="search-section">
      <div class="search-bar">
        <input id="searchInput" class="search-input" placeholder="Search influencers..." />
        <button class="btn-primary" onclick="searchInfluencers()">Search</button>
      </div>
    </div>
    <div id="influencersGrid" class="cards-grid"></div>
  </div>
</div>

<!-- ===== Profile Modal (tabbed) ===== -->
<div id="profileModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeProfileModal()">×</button>
    <div id="profileHeader" class="modal-header"></div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('services')">Services</button>
      <button class="tab-btn" onclick="switchTab('reviews')">Reviews</button>
    </div>
    <div id="tab-services" class="tab-content"></div>
    <div id="tab-reviews" class="tab-content" style="display:none"></div>
  </div>
</div>
<script type="module">
  /* ========= Firebase (v10 modular) ========= */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import {
    getFirestore, collection, doc, getDoc, getDocs, addDoc,
    query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAjYOUXAU1FusccFJQcsEWmo8W9CgSSmfA",
    authDomain: "rateinflu.firebaseapp.com",
    projectId: "rateinflu",
    storageBucket: "rateinflu.firebasestorage.app",
    messagingSenderId: "619786232167",
    appId: "1:619786232167:web:eca2e76803201421eccfc2",
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  const provider = new GoogleAuthProvider();

  /* ========= Auth UI ========= */
  let currentUser = null;
  onAuthStateChanged(auth, (u) => {
    currentUser = u || null;
    const container = document.getElementById("authContainer");
    if (u) {
      container.innerHTML = `
        <span style="margin-right:1rem;color:#555">${u.displayName || u.email}</span>
        <button class="btn-primary" id="logoutBtn">Logout</button>`;
      document.getElementById("logoutBtn").onclick = () => signOut(auth);
    } else {
      container.innerHTML = `<button class="btn-primary" id="loginBtn">Login with Google</button>`;
      document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, provider);
    }
  });

  /* ========= Home: load influencers ========= */
  let allInfluencers = [];

  function trustBadge(inf) {
    const score = inf.trustScore || 0;
    const cls = score > 80 ? "trust-high" : score > 50 ? "trust-medium" : "trust-low";
    const txt = score > 80 ? "✓ Trusted" : score > 50 ? "⚡ Mixed" : "⚠️ Caution";
    return `<div class="trust-badge ${cls}">${txt}</div>`;
  }

  function initials(name="") {
    return name.trim().split(" ").map(n=>n[0]).filter(Boolean).join("").toUpperCase();
  }

  function renderCard(inf) {
    return `
      <div class="influencer-card" onclick="openProfile('${inf.id}')">
        ${trustBadge(inf)}
        <div class="card-header">
          <div style="display:flex;gap:1rem;align-items:center">
            <div class="profile-image">${initials(inf.name)}</div>
            <div>
              <div style="font-weight:700;font-size:1.1rem">${inf.name}</div>
              <div style="color:var(--gray)">${inf.niche || ""}</div>
            </div>
          </div>
        </div>
        <div style="padding:1rem;font-size:.9rem;color:var(--dark)">${inf.bio || ""}</div>
        <div style="padding:0 1rem 1rem;color:var(--gray);font-size:.85rem">
          ${(inf.stats?.reviewCount || 0)} reviews • ${(inf.stats?.rating || 0)}★
        </div>
      </div>
    `;
  }

  async function loadInfluencers() {
    const grid = document.getElementById("influencersGrid");
    grid.innerHTML = `<div class="loading-container">
        <div class="loading-spinner"></div><p>Loading influencers...</p></div>`;
    const snap = await getDocs(collection(db, "influencers"));
    allInfluencers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    grid.innerHTML = allInfluencers.map(renderCard).join("");
  }

  /* ========= Search ========= */
  window.searchInfluencers = function () {
    const term = (document.getElementById("searchInput").value || "").toLowerCase();
    const filtered = allInfluencers.filter(i =>
      i.name?.toLowerCase().includes(term) || (i.niche || "").toLowerCase().includes(term)
    );
    document.getElementById("influencersGrid").innerHTML = filtered.map(renderCard).join("");
  };

  /* ========= Navigation helpers ========= */
  window.navigateHome = function () {
    // just close modal if open; homepage is the base
    closeProfileModal();
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  /* ========= Profile Modal (tabs) ========= */
  const modal        = document.getElementById("profileModal");
  const headerEl     = document.getElementById("profileHeader");
  const tabServices  = document.getElementById("tab-services");
  const tabReviews   = document.getElementById("tab-reviews");

  function formatDate(ts) {
    // Firestore Timestamp {seconds,nanoseconds} or Date
    try {
      if (!ts) return "";
      if (ts.seconds) return new Date(ts.seconds * 1000).toLocaleDateString();
      const d = new Date(ts);
      return isNaN(d.getTime()) ? "" : d.toLocaleDateString();
    } catch { return ""; }
  }

  function socialBadges(inf) {
    const sp = inf.socialPlatforms || {};
    const parts = [];
    for (const [platform, followers] of Object.entries(sp)) {
      const abbrev = platform === "instagram" ? "IG"
                   : platform === "youtube"   ? "YT"
                   : platform === "tiktok"    ? "TT"
                   : platform === "twitter"   ? "X" : platform.slice(0,2).toUpperCase();
      const pretty = followers >= 1_000_000 ? (followers/1_000_000).toFixed(1) + "M"
                   : followers >= 1_000 ? Math.round(followers/1_000) + "K"
                   : (followers || 0);
      parts.push(`<span style="background:var(--light-gray);padding:.25rem .5rem;border-radius:8px;font-weight:600">
        ${abbrev} ${pretty}</span>`);
    }
    return parts.join(" ");
  }

  function renderHeader(inf) {
    const score = inf.trustScore || 0;
    const label = score > 80 ? "✓ Trusted" : score > 50 ? "⚡ Mixed" : "⚠️ Caution";
    return `
      <div class="profile-image">${initials(inf.name)}</div>
      <div>
        <h2>${inf.name}</h2>
        <p>${inf.niche || ""} • ${label}</p>
        <div style="margin-top:.4rem;display:flex;gap:.4rem;flex-wrap:wrap">${socialBadges(inf)}</div>
      </div>
    `;
  }

  function renderServices(services) {
    if (!services.length) return `<p style="color:var(--gray)">No services listed.</p>`;
    return `
      <div class="section">
        <h3>Services</h3>
        ${services.map(s => `
          <div class="service-item">
            <div>💼 ${s.title || ""}</div>
            <div style="color:var(--success);font-weight:700">${s.price ? `$${s.price}` : ""}</div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function renderReviews(reviews, infId) {
    const list = reviews.length
      ? reviews.map(r => `
          <div class="review-item">
            <strong>${r.userName || r.author || "Anonymous"}</strong>
            <p>${r.text || ""}</p>
            <div style="color:var(--gray);font-size:.9rem">${formatDate(r.createdAt)}</div>
          </div>
        `).join("")
      : `<p style="color:var(--gray)">No reviews yet.</p>`;

    const form = currentUser
      ? `
        <div class="review-form">
          <input id="newReviewInput" placeholder="Write a review..." />
          <button onclick="addReview('${infId}')">Post</button>
        </div>
      `
      : `<p style="margin-top:.75rem;color:var(--gray)">Login to post a review.</p>`;

    return `
      <div class="section">
        <h3>Reviews</h3>
        ${list}
        ${form}
      </div>
    `;
  }

  // Switch tabs (purple underline for active)
  window.switchTab = function (which) {
    const btns = document.querySelectorAll(".tab-btn");
    btns.forEach(b => b.classList.remove("active"));
    if (which === "services") {
      btns[0].classList.add("active");
      tabServices.style.display = "block";
      tabReviews.style.display  = "none";
    } else {
      btns[1].classList.add("active");
      tabServices.style.display = "none";
      tabReviews.style.display  = "block";
    }
  };

  // Open profile modal with Firestore data
  window.openProfile = async function (infId) {
    headerEl.innerHTML   = `<div style="width:100%">Loading...</div>`;
    tabServices.innerHTML= "";
    tabReviews.innerHTML = "";
    switchTab("services");
    modal.style.display = "flex";

    const infRef = doc(db, "influencers", infId);
    const infSnap = await getDoc(infRef);
    if (!infSnap.exists()) {
      headerEl.innerHTML = `<div>Profile not found.</div>`;
      return;
    }
    const inf = { id: infId, ...infSnap.data() };

    // services
    const svcSnap = await getDocs(collection(infRef, "services"));
    const services = svcSnap.docs.map(d => d.data());

    // reviews (newest first)
    const revSnap = await getDocs(query(collection(infRef, "reviews"), orderBy("createdAt", "desc")));
    const reviews = revSnap.docs.map(d => d.data());

    // render
    headerEl.innerHTML   = renderHeader(inf);
    tabServices.innerHTML= renderServices(services);
    tabReviews.innerHTML = renderReviews(reviews, infId);
  };

  window.addReview = async function (infId) {
    const input = document.getElementById("newReviewInput");
    if (!input) return;
    const text = (input.value || "").trim();
    if (!text) return;
    if (!currentUser) { alert("Please login to post a review."); return; }

    await addDoc(collection(db, "influencers", infId, "reviews"), {
      text,
      userName: currentUser.displayName || currentUser.email,
      createdAt: serverTimestamp()
    });
    // refresh reviews tab
    openProfile(infId);
    switchTab("reviews");
  };

  window.closeProfileModal = function () {
    modal.style.display = "none";
  };

  // close on backdrop click
  modal.addEventListener("click", (e) => {
    if (e.target === modal) modal.style.display = "none";
  });

  // initial load
  loadInfluencers();
</script>
</html>
